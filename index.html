<style>
:root{
  --bg:#f6f5f1; --panel:#fff; --ink:#22281f; --sub:#667060; --line:#dcded6; --line2:#eceee8;
  --accent:#3f6b45; --accent-ink:#fff; --accent-soft:#e7efe6;
  --red:#b3261e; --red-soft:#fbe9e7; --amber:#8a5a00; --amber-soft:#fff3d6; --blue:#1d5a8a; --blue-soft:#e6f0f8;
  --gray-soft:#f0f0ec;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
header.top{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header.top h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.scroll > table.t{min-width:820px}
@media (max-width:700px){header.top{flex-wrap:wrap;gap:8px;padding:10px 16px} #todayLabel,.who{display:none} nav.tabs{top:0;position:relative;padding:0 8px} main{padding:16px} .modal{padding:14px}}
header.top .sp{flex:1}
header.top .who{color:var(--sub);font-size:12px}
nav.tabs{display:flex;gap:2px;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:49px;z-index:19}
nav.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--sub);border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
main{padding:20px;max-width:1400px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 12px}
.card h3{font-size:14px;margin:16px 0 8px}
.muted{color:var(--sub)}
.small{font-size:12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:800px){.g2,.g3,.g4{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--sub)}
label.f > span{font-weight:600}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],select,textarea{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:#fff;color:var(--ink);min-width:0;width:100%}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--gray-soft)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--red);border-color:#e6b7b2}
.btn.sm{padding:3px 8px;font-size:12px}

table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{border-bottom:1px solid var(--line2);padding:7px 8px;text-align:left;vertical-align:top}

table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:#fafcf8}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow:auto}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.p-red{background:var(--red-soft);color:var(--red)}
.p-amber{background:var(--amber-soft);color:var(--amber)}
.p-green{background:var(--accent-soft);color:var(--accent)}
.p-blue{background:var(--blue-soft);color:var(--blue)}
.p-gray{background:var(--gray-soft);color:var(--sub)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--sub)}
.kpi.red .v{color:var(--red)} .kpi.amber .v{color:var(--amber)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:6px;margin-bottom:6px;border:1px solid var(--line2)}
.alert .who{font-weight:700;min-width:110px}
.alert .msg{flex:1}
.alert.red{background:var(--red-soft);border-color:#f0c9c4}
.alert.amber{background:var(--amber-soft);border-color:#f0dfae}
.alert.blue{background:var(--blue-soft);border-color:#c9dcec}
.hidden{display:none !important}
#login{max-width:380px;margin:80px auto}
.modal-bg{position:fixed;inset:0;background:rgba(20,24,18,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto}
.modal{background:#fff;border-radius:10px;max-width:1000px;width:100%;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.modal h2{margin:0 0 12px;font-size:16px}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:12px;border-top:1px solid var(--line2)}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink)}
.checks label{display:flex;gap:4px;align-items:center}
.warn{color:var(--red);font-size:12px}
.note{background:#fafaf7;border:1px dashed var(--line);border-radius:6px;padding:8px 10px;font-size:12px;color:var(--sub)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#22281f;color:#fff;padding:10px 16px;border-radius:6px;z-index:100;font-size:13px}
.score{display:flex;gap:4px}
.score button{width:34px;padding:5px 0;border:1px solid var(--line);background:#fff;border-radius:5px;cursor:pointer}
.score button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.split{grid-template-columns:1fr}}
dl.kv{display:grid;grid-template-columns:120px 1fr;gap:4px 10px;margin:0;font-size:13px}
dl.kv dt{color:var(--sub)}
dl.kv dd{margin:0}

/* ===== 印刷 ===== */
#printArea{display:none}
@media print{
  @page{size:A4;margin:10mm 12mm}
  body{background:#fff}
  body > *:not(#printArea){display:none !important}

.policy h1{font-size:16pt;text-align:center;margin:0 0 6mm}
.policy h2{font-size:12pt;border-bottom:1px solid #000;margin:6mm 0 2mm;padding-bottom:1mm}
.policy table{border-collapse:collapse;width:100%;margin:2mm 0}
.policy th,.policy td{border:1px solid #000;padding:1mm 2mm;text-align:left;font-weight:400}
.policy th{background:#f2f2f2}
</style>

<script>
'use strict';
// ===== 接続設定（勤怠システムと同じ Supabase プロジェクト） =====
const SUPABASE_URL = 'https://bngafucbmdnehzqmsles.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Zd5lDU_gxbWzBAqnwo-_2g_wmisbRyk';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// 契約書の文面・描画は contract-render.js（署名ページと共通）
const CR = window.ContractRender; CR.injectStyles();
const PUBLIC_BASE = 'https://ymiyagawatheherbs-tech.github.io/theherbs-contracts/';

const EMP_TYPES = ['正社員','契約社員','パートタイム','アルバイト'];
const CHANGE_TYPES = ['新規','条件変更なし更新','賃金改定あり更新','条件変更あり更新','雇用形態変更','契約終了','過去分登録'];
const STATUSES = ['下書き','締結済','要確認','終了'];
const WAGE_TYPES = ['時給','日給','日給月給','月給'];

// ===== 状態 =====
const S = { employees:[], ws:{}, locations:{}, contracts:[], reviews:[], bonuses:[], requests:[], settings:{}, stats:null, statsRange:null, me:null, tab:'dash' };

// ===== ユーティリティ =====
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen = n => (n == null || n === '' || isNaN(n)) ? '' : Number(n).toLocaleString('ja-JP');
const pad = n => String(n).padStart(2,'0');
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function parseD(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function fmtD(s){ if(!s) return ''; const d=parseD(s); return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}`; }
function toStr(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function addDays(s,n){ const d=parseD(s); d.setDate(d.getDate()+n); return toStr(d); }
function addMonths(s,n){ const d=parseD(s); const day=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n); const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); d.setDate(Math.min(day,last)); return toStr(d); }
function daysBetween(a,b){ return Math.round((parseD(b)-parseD(a))/86400000); }
function yearsBetween(a,b){ return daysBetween(a,b)/365.25; }
function tenureLabel(from, to){ if(!from) return ''; const a=parseD(from), b=parseD(to||todayStr()); let m=(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth()); if(b.getDate()<a.getDate()) m--; if(m<0) return ''; return `${Math.floor(m/12)}年${m%12}か月`; }
function wareki(s){ if(!s) return {y:'',m:'',d:''}; const d=parseD(s); return {y:d.getFullYear()-2018, m:d.getMonth()+1, d:d.getDate()}; }
function warekiText(s){ if(!s) return '令和　　年　　月　　日'; const w=wareki(s); return `令和 ${w.y}年 ${w.m}月 ${w.d}日`; }
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function empName(id){ const e=S.employees.find(x=>x.id===id); return e? e.name : '(不明)'; }
function ck(on){ return on ? '☑' : '☐'; }
function setting(key, fallback){ return (S.settings[key] && S.settings[key].value) ?? fallback; }
function minWage(){ return Number(setting('min_wage',{}).amount || 0); }

// 時給換算（最低賃金チェック用）
function hourlyEquivalent(c){
  if(!c) return null;
  const w=Number(c.base_wage||0);
  if(c.wage_type==='時給') return w;
  if(c.wage_type==='日給') return c.hours_per_day ? w/Number(c.hours_per_day) : null;
  // 月給・日給月給：月平均所定労働時間＝週所定×52÷12
  const wh = Number(c.weekly_hours || (c.days_per_week && c.hours_per_day ? c.days_per_week*c.hours_per_day : 0));
  return wh ? w/(wh*52/12) : null;
}

// ===== 契約の解釈 =====
function contractsOf(empId){ return S.contracts.filter(c=>c.employee_id===empId).sort((a,b)=> (b.start_date||'').localeCompare(a.start_date||'') || b.seq-a.seq); }
function currentContract(empId){
  const list=contractsOf(empId).filter(c=>c.status!=='下書き');
  const t=todayStr();
  return list.find(c=>c.start_date<=t && (!c.end_date || c.end_date>=t)) || list[0] || null;
}
function draftOf(empId){ return contractsOf(empId).find(c=>c.status==='下書き') || null; }
function firstStart(emp){
  const list=contractsOf(emp.id).filter(c=>c.status!=='下書き');
  const fromC = list.length ? list[list.length-1].start_date : null;
  return [emp.hire_date, fromC].filter(Boolean).sort()[0] || null;
}
function lastReview(empId){ return S.reviews.filter(r=>r.employee_id===empId).sort((a,b)=>b.review_date.localeCompare(a.review_date))[0] || null; }
function activeStaff(){ return S.employees.filter(e=>e.active && e.role!=='admin'); }

// アラート判定
function alertsFor(emp){
  const out=[]; const t=todayStr();
  const rules=setting('review_rules',{}); const alertDays=Number(rules.alert_days||60); const mkYears=Number(rules.mukitenkan_years||5);
  const c=currentContract(emp.id); const dr=draftOf(emp.id);
  if(!c){ out.push({lv:'red',code:'none',msg:'契約が登録されていません'}); return out; }
  if(c.is_fixed_term && c.end_date){
    const left=daysBetween(t,c.end_date);
    if(left<0) out.push({lv:'red',code:'expired',msg:`契約期間が終了しています（${fmtD(c.end_date)}終了・${-left}日経過）。更新契約の締結が必要です`+(dr?'（下書きあり）':'')});
    else if(left<=alertDays) out.push({lv:'amber',code:'soon',msg:`契約終了まで${left}日（${fmtD(c.end_date)}）。面談・更新準備を開始してください`+(dr?'（下書きあり）':'')});
  }
  if(c.status==='要確認') out.push({lv:'amber',code:'check',msg:'台帳から移行した契約で内容の確認が必要です'+(c.note?`：${c.note}`:'')});
  const fs=firstStart(emp);
  if(c.is_fixed_term && fs){
    const reach=addMonths(fs, mkYears*12);
    if(reach<=t) out.push({lv:'red',code:'muki',msg:`有期契約の通算が${mkYears}年を超えています（初回契約 ${fmtD(fs)}）。無期転換申込権の告知・対応方針の決定が必要です`});
    else if(c.end_date && reach<=c.end_date) out.push({lv:'amber',code:'muki',msg:`現契約期間中に通算${mkYears}年に達します（${fmtD(reach)}）。次回更新時に無期転換申込権が発生します`});
  }
  const mw=minWage(); const he=hourlyEquivalent(c);
  if(mw && he!=null && he<mw) out.push({lv:'red',code:'minwage',msg:`時給換算 ${Math.floor(he).toLocaleString()}円が最低賃金 ${mw.toLocaleString()}円を下回っています`});
  if(c.status==='締結済' && !c.file_path) out.push({lv:'blue',code:'nofile',msg:'署名済み契約書（PDF・画像）が未保管です'});
  const lr=lastReview(emp.id);
  if(!lr) out.push({lv:'blue',code:'noreview',msg:'昇給検討の記録がまだありません'});
  else if(daysBetween(lr.review_date,t)>365) out.push({lv:'blue',code:'oldreview',msg:`前回の昇給検討から1年以上経過（${fmtD(lr.review_date)}）`});
  return out;
}
function statusPill(c){
  if(!c) return '<span class="pill p-red">未登録</span>';
  const cls={'締結済':'p-green','要確認':'p-amber','下書き':'p-gray','終了':'p-gray'}[c.status]||'p-gray';
  return `<span class="pill ${cls}">${esc(c.status)}</span>`;
}
function wageText(c){ if(!c) return ''; return `${c.wage_type} ${yen(c.base_wage)}円`; }

// ===== データ読み込み =====
async function loadAll(){
  const [emp, ws, loc, con, rev, bon, set, req] = await Promise.all([
    sb.from('employees').select('id,code,name,hire_date,active,role,title,location_id,schedule,week_days,sort_order,email').order('code'),
    sb.from('work_settings').select('employee_id,daily_hours,sched_in,sched_out,break_hours'),
    sb.from('locations').select('id,name'),
    sb.from('contracts').select('*'),
    sb.from('wage_reviews').select('*'),
    sb.from('bonuses').select('*'),
    sb.from('hr_settings').select('*'),
    sb.from('contract_sign_requests').select('*').order('created_at',{ascending:false})
  ]);
  for(const r of [emp,ws,loc,con,rev,bon,set,req]) if(r.error) throw r.error;
  S.requests=req.data;
  S.employees=emp.data; S.contracts=con.data; S.reviews=rev.data; S.bonuses=bon.data;
  S.ws={}; ws.data.forEach(w=>S.ws[w.employee_id]=w);
  S.locations={}; loc.data.forEach(l=>S.locations[l.id]=l.name);
  S.settings={}; set.data.forEach(s=>S.settings[s.key]=s);
}
async function loadStats(from,to){
  const { data, error } = await sb.rpc('hr_attendance_stats', { p_from: from, p_to: to });
  if(error) throw error;
  const m={}; data.forEach(r=>m[r.employee_id]=r); return m;
}

// ===== 画面切替 =====
function showTab(name){
  S.tab=name;
  $$('#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.tab===name));
  ['dash','staff','review','sign','bonus','settings'].forEach(t=>$('#tab-'+t).classList.toggle('hidden', t!==name));
  render();
}
function render(){
  ({dash:renderDash, staff:renderStaff, review:renderReview, sign:renderSign, bonus:renderBonus, settings:renderSettings})[S.tab]();
}

// ===== ダッシュボード =====
function renderDash(){
  const staff=activeStaff();
  const all=staff.map(e=>({e, a:alertsFor(e)}));
  const cnt=code=>all.filter(x=>x.a.some(a=>a.code===code)).length;
  const reds=all.flatMap(x=>x.a.filter(a=>a.lv==='red').map(a=>({...a,e:x.e})));
  const ambers=all.flatMap(x=>x.a.filter(a=>a.lv==='amber').map(a=>({...a,e:x.e})));
  const blues=all.flatMap(x=>x.a.filter(a=>a.lv==='blue').map(a=>({...a,e:x.e})));
  const mw=setting('min_wage',{});
  const line=a=>`<div class="alert ${a.lv}"><div class="who"><a href="#" data-emp="${a.e.id}">${esc(a.e.name)}</a></div><div class="msg">${esc(a.msg)}</div></div>`;
  $('#tab-dash').innerHTML=`
  <div class="kpis">
    <div class="kpi"><div class="v">${staff.length}</div><div class="l">在籍者（管理者除く）</div></div>
    <div class="kpi red"><div class="v">${cnt('expired')+cnt('none')}</div><div class="l">契約切れ・未登録</div></div>

// ===== モーダル =====
function openModal(html, {wide=false}={}){
  const root=$('#modalRoot');
  root.innerHTML=`<div class="modal-bg"><div class="modal" style="${wide?'max-width:1200px':''}">${html}</div></div>`;
  const bg=$('.modal-bg',root);
  bg.addEventListener('mousedown',ev=>{ if(ev.target===bg) bg.dataset.down='1'; });
  bg.addEventListener('mouseup',ev=>{ if(ev.target===bg && bg.dataset.down) closeModal(); bg.dataset.down=''; });
  return $('.modal',root);
}
function closeModal(){ $('#modalRoot').innerHTML=''; }

// ===== 契約書ファイルの保管 =====
async function uploadFile(c, file){
  if(!c||!file) return;
  const ext=(file.name.split('.').pop()||'pdf').toLowerCase().replace(/[^a-z0-9]/g,'');
  const e=S.employees.find(x=>x.id===c.employee_id);
  const path=`${e.code}/${c.start_date}_${c.seq}_${Date.now()}.${ext}`;
  const up=await sb.storage.from('contracts').upload(path, file, {upsert:false, contentType:file.type||undefined});
  if(up.error){ alert('アップロードに失敗しました：'+up.error.message); return; }
  const patch={file_path:path};
  if(c.status!=='締結済' && confirm('署名済みの契約書として保管しました。この契約の状態を「締結済」にしますか？')){
    patch.status='締結済'; if(!c.signed_date) patch.signed_date=todayStr();
  }
  const r=await sb.from('contracts').update(patch).eq('id',c.id).select().single();
  if(r.error){ alert(r.error.message); return; }
  Object.assign(c, r.data); toast('契約書を保管しました'); openEmployee(c.employee_id); render();
}
async function viewFile(c){
  const r=await sb.storage.from('contracts').createSignedUrl(c.file_path, 300);
  if(r.error){ alert(r.error.message); return; }
  window.open(r.data.signedUrl,'_blank');
}

// 昇給・賞与欄の初期値（賃金規程第15・16条、非正規従業員規程第40条）
const RAISE_BONUS_TEXT={
  regular:{raise:'毎年7月支給分から、勤務成績その他を勘案して行う（賃金規程第15条）', bonus:'12月に、会社の業績と勤務成績等を勘案して支給することがある（賃金規程第16条）'},
  other:{raise:'定期昇給なし（契約更新時に、勤務成績等により賃金を改定することがある）', bonus:'なし（原則として支給しない）'}
};
function raiseBonusFor(type){ return type==='正社員'? RAISE_BONUS_TEXT.regular : RAISE_BONUS_TEXT.other; }
// シフト制は神戸阪急を含む就業場所のときだけ（本社はシフト制ではない・2026-11-12）
function isShiftLocation(locs){ return (locs||[]).some(x=>String(x).includes('神戸阪急')); }
function newContractFor(e){
  const ws=S.ws[e.id]; const t=todayStr();
  const start=t; const end=addDays(addMonths(start,12),-1);
  const loc=S.locations[e.location_id];
  return { employee_id:e.id, seq:1, change_type:'新規', employment_type:'パートタイム', is_fixed_term:true,
    start_date:start, end_date:end, wage_type:'時給', base_wage:minWage()||'', allowances:[], work_locations: loc?[loc]:[], work_location_other:'',
    departments:[], job_detail:'仕事については業種を特定せず、関連業務その他を手伝ってもらう場合があります',
    shifts: ws&&ws.sched_in? [{label:'勤務1',in:ws.sched_in.slice(0,5),out:(ws.sched_out||'').slice(0,5),break_min:Math.round((ws.break_hours||0)*60)}] : [],
    days_per_week:null, hours_per_day: ws?.daily_hours||null, weekly_hours:null, shift_based:isShiftLocation(loc?[loc]:[]), variable_hours:false,
    workers_comp:true, employment_insurance:true, social_insurance:false, renewal:'更新見込有り', renewal_cap:'∞',
    raise_text:RAISE_BONUS_TEXT.other.raise, bonus_text:RAISE_BONUS_TEXT.other.bonus, retirement_allowance_text:'なし',
    status:'下書き', signed_date:null, reason:'', note:'' };
}
function renewFrom(c){
  const n=JSON.parse(JSON.stringify(c));
  delete n.id; delete n.created_at; delete n.updated_at; n.file_path=null; n.signed_date=null;
  const maxSeq=Math.max(...contractsOf(c.employee_id).map(x=>x.seq));
  n.seq=maxSeq+1; n.change_type='条件変更なし更新'; n.status='下書き'; n.reason=''; n.note='';
  const base = c.end_date ? addDays(c.end_date,1) : todayStr();
  n.start_date = base;
  n.end_date = c.is_fixed_term ? addDays(addMonths(n.start_date,12),-1) : null;
  { const rb=raiseBonusFor(n.employment_type); n.raise_text=rb.raise; n.bonus_text=rb.bonus; }
  if(c.end_date && c.end_date < todayStr()) n.note=`前契約（${fmtD(c.end_date)}満了）の翌日から切れ目なく続く契約として作成。満了後も同じ条件で勤務していた期間を含みます`;
  return n;
}

  check();

  const collect=()=>{
    const o={...c};
    ['change_type','employment_type','status','start_date','end_date','signed_date','wage_type','work_location_other','job_detail','renewal','renewal_cap','raise_text','bonus_text','retirement_allowance_text','reason','note'].forEach(n=>o[n]=F(n).value||null);
    o.is_fixed_term=F('is_fixed_term').value==='1';
    if(!o.is_fixed_term) o.end_date=null;
    o.base_wage=F('base_wage').value===''?null:Number(F('base_wage').value);
    ['days_per_week','hours_per_day','weekly_hours'].forEach(n=>o[n]=F(n).value===''?null:Number(F(n).value));

    const prevC=contractsOf(c.employee_id).filter(x=>x.id!==c.id && x.status!=='下書き')[0];
    if(prevC && o.change_type==='条件変更なし更新' && o.base_wage!=null && (o.base_wage!==prevC.base_wage || o.wage_type!==prevC.wage_type)) o.change_type='賃金改定あり更新';
    return o;
  };
  const save=async()=>{
    const o=collect();
    if(!o.start_date || o.base_wage==null){ alert('開始日と基本給は必須です'); return null; }
    if(o.is_fixed_term && !o.end_date){ alert('有期契約の場合は終了日を入力してください'); return null; }
    if(o.end_date && o.end_date<o.start_date){ alert('終了日が開始日より前になっています'); return null; }
    const he=hourlyEquivalent(o); const mw=minWage();
    if(mw && he!=null && he<mw && !confirm(`時給換算 ${Math.floor(he)}円は最低賃金 ${mw}円を下回っています。このまま保存しますか？`)) return null;
    if(o.status==='締結済' && !o.signed_date) o.signed_date=todayStr();
    const payload={...o}; delete payload.id; delete payload.created_at; delete payload.updated_at;
    let r;
    const openReqs = o.id ? S.requests.filter(x=>x.contract_id===o.id && ['送付済','閲覧済'].includes(x.status)) : [];
    if(openReqs.length){
      if(!confirm('この契約は署名依頼を送付済みです。内容を変更すると、送付済みのリンクは無効になります（あらためて署名依頼を送ってください）。保存しますか？')) return null;
      await revokeRequests(openReqs.map(x=>x.id));
    }
    if(o.id) r=await sb.from('contracts').update(payload).eq('id',o.id).select().single();
    else r=await sb.from('contracts').insert(payload).select().single();
    if(r.error){ alert('保存に失敗しました：'+r.error.message); return null; }
    const saved=r.data;
    const i=S.contracts.findIndex(x=>x.id===saved.id); if(i>=0) S.contracts[i]=saved; else S.contracts.push(saved);
    // 新しい契約が締結済になったら、それ以前の有効な契約を「終了」にする
    if(saved.status==='締結済'){
      const olds=S.contracts.filter(x=>x.employee_id===saved.employee_id && x.id!==saved.id && ['締結済','要確認'].includes(x.status) && x.start_date<saved.start_date);
      if(olds.length && confirm(`以前の契約 ${olds.length}件を「終了」にしますか？（履歴として残ります）`)){
        const u=await sb.from('contracts').update({status:'終了'}).in('id',olds.map(x=>x.id)).select();
        if(!u.error) u.data.forEach(d=>{ const k=S.contracts.findIndex(x=>x.id===d.id); S.contracts[k]=d; });
      }

    toast('保存しました');
    return saved;
  };

}
function normTime(v){
  if(!v) return '';
  let t=String(v).replace(/[０-９：]/g,c=>c==='：'?':':String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/\s/g,'');
  let m=t.match(/^(\d{1,2}):?(\d{2})$/); if(!m) return t;
  const h=Number(m[1]), mi=Number(m[2]); if(h>29||mi>59) return t;
  return `${pad(h)}:${pad(mi)}`;
}
function shiftHours(s){
  const a=normTime(s.in), b=normTime(s.out);
  if(!/^\d\d:\d\d$/.test(a)||!/^\d\d:\d\d$/.test(b)) return '';
  const [h1,m1]=a.split(':').map(Number), [h2,m2]=b.split(':').map(Number);
  const mins=(h2*60+m2)-(h1*60+m1)-(Number(s.break_min)||0);
  return mins>0? (Math.round(mins/60*100)/100)+'時間' : '';
}

function signUrl(r){ return PUBLIC_BASE + 'sign.html?t=' + r.token; }
function reqsOf(contractId){ return S.requests.filter(r=>r.contract_id===contractId); }
function activeReq(contractId){ return reqsOf(contractId).find(r=>['送付済','閲覧済','署名済'].includes(r.status)) || null; }
function signedReqOfEmp(empId){ return S.requests.find(r=>r.employee_id===empId && r.status==='署名済') || null; }
function reqBadge(c){
  const r=activeReq(c.id); if(!r) return '';
  const cls={'送付済':'p-blue','閲覧済':'p-amber','署名済':'p-green'}[r.status];
  return `<div class="small" style="margin-top:4px"><span class="pill ${cls}">${r.status==='署名済'?'電子署名済':r.status==='閲覧済'?'署名待ち（閲覧済）':'署名待ち（未読）'}</span></div>`;
}
function textApproved(){ const t=setting('contract_text',null); return !!(t && t.approved); }
function mailParts(r, c, e){
  const co=setting('company',{});
  const period = c.end_date ? `${fmtD(c.start_date)}〜${fmtD(c.end_date)}` : `${fmtD(c.start_date)}から`;
  const subject = `【${co.name||'THE HERBS'}】雇用契約書の確認と署名のお願い`;
  const body =
`${e.name} さん

いつもありがとうございます。
雇用契約書（契約期間：${period}）をお送りします。
下記のリンクから内容を確認し、${fmtD(r.expires_at.slice(0,10))}までに署名をお願いします。スマートフォンからも開けます。

${signUrl(r)}

内容でわからないことがあれば、署名の前に遠慮なくご相談ください。
紙での受け取りを希望する場合も、署名せずにお知らせください。

${co.name||''}
${(co.representative||'').replace(/^代表取締役\s*/,'')}
`;
  return {subject, body};
}

}

async function copyText(t){ try{ await navigator.clipboard.writeText(t); toast('コピーしました'); }catch(e){ prompt('コピーしてください', t); } }
async function revokeRequests(ids){
  if(!ids.length) return;
  const r=await sb.from('contract_sign_requests').update({status:'取消', revoked_at:new Date().toISOString()}).in('id',ids).select();
  if(r.error){ alert(r.error.message); return; }

// ダッシュボード：契約書の取り交わし
function signTodo(){
  const t=todayStr(); const out=[];
  for(const e of activeStaff()){
    const cur=currentContract(e.id); const dr=draftOf(e.id);
    if(!cur){ out.push({e, kind:'none', label:'契約未登録', c:dr}); continue; }
    if(cur.is_fixed_term && cur.end_date && cur.end_date<t){ out.push({e, kind:'expired', label:`${fmtD(cur.end_date)}に満了`, c:dr, cur}); continue; }
    const r=activeReq(cur.id);
    if(r && r.status==='署名済') continue;
    if(cur.file_path) continue;
    out.push({e, kind:r?'waiting':'unsigned', label: r? `署名待ち（${r.status}）` : (cur.status==='要確認'?'内容の確認と署名が必要':'署名済み原本なし'), c:cur, req:r});
  }
  return out;
}

// ===== 契約書の中身から読み取る（文字が埋め込まれたPDF・Word .docx） =====
async function fileText(file){
  const name=file.name.toLowerCase();
  if(name.endsWith('.pdf')){
    const lib=window.pdfjsLib; if(!lib) return {text:'', why:'PDF読み取り機能を読み込めませんでした'};
    lib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
    const pdf=await lib.getDocument({data:await file.arrayBuffer()}).promise;
    let text='';
    for(let p=1;p<=Math.min(pdf.numPages,4);p++){ const pg=await pdf.getPage(p); const tc=await pg.getTextContent(); text+=tc.items.map(i=>i.str).join(' ')+'\n'; }
    return {text, why: text.replace(/\s/g,'').length<20 ? 'スキャン画像のPDFのため文字を読み取れません' : ''};
  }
  if(name.endsWith('.docx')){
    if(!window.mammoth) return {text:'', why:'Word読み取り機能を読み込めませんでした'};
    const r=await window.mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});
    return {text:r.value, why:''};
  }
  if(name.endsWith('.doc')) return {text:'', why:'古いWord形式（.doc）は読み取れません。Wordで開き「PDFとして保存」してから選んでください'};
  return {text:'', why:'画像のため文字を読み取れません'};
}
function zen2han(s){ return s.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[，]/g,',').replace(/[～〜]/g,'~'); }
function parseContractText(raw){
  const t=zen2han(raw).replace(/[\s　]+/g,'');
  const out={};
  const era=(y)=> y==='元'?2019:2018+Number(y);
  const D=(y,m,d)=>`${y}-${pad(+m)}-${pad(+d)}`;
  // 契約期間（令和／西暦）
  let m=t.match(/令和(\d+|元)年(\d{1,2})月(\d{1,2})日[~ー－\-から至]+令和(\d+|元)年(\d{1,2})月(\d{1,2})日/);
  if(m){ out.start=D(era(m[1]),m[2],m[3]); out.end=D(era(m[4]),m[5],m[6]); }
  if(!out.start){ m=t.match(/(20\d{2})年(\d{1,2})月(\d{1,2})日[~ー－\-から至]+(20\d{2})年(\d{1,2})月(\d{1,2})日/); if(m){ out.start=D(m[1],m[2],m[3]); out.end=D(m[4],m[5],m[6]); } }
  // 賃金変更承諾書など「○年○月○日より（から）」
  if(!out.start){ m=t.match(/令和(\d+|元)年(\d{1,2})月(\d{1,2})日(?:より|から|付)/) ; if(m) out.start=D(era(m[1]),m[2],m[3]); }
  if(!out.start){ m=t.match(/契約期間[^令]{0,20}令和(\d+|元)年(\d{1,2})月(\d{1,2})日/); if(m) out.start=D(era(m[1]),m[2],m[3]); }
  if(/[☑■✓✔]定めなし/.test(t)){ out.end=''; out.fixed=false; }
  // 雇用形態
  if(/正社員用|正社員雇用契約|雇用契約書\(正社員/.test(t)) out.etype='正社員';
  else if(/契約社員/.test(t)) out.etype='契約社員';
  else if(/アルバイト/.test(t) && !/パート/.test(t)) out.etype='アルバイト';
  else if(/非正規|パート/.test(t)) out.etype='パートタイム';
  // 賃金形態（チェックの付いたもの）
  m=t.match(/[☑■✓✔](日給月給|日給|時給|月給)/); if(m) out.wtype=m[1];
  // 金額：変更後（「→」「変更後」「改定後」の後）を優先、なければ基本給・時給の後の金額
  const nums=[];
  let re=/(?:変更後|改定後|新|→|円から|円より)[^\d]{0,12}([\d,]{3,9})円/g; while((m=re.exec(t))) nums.push(+m[1].replace(/,/g,''));
  if(!nums.length){ re=/(?:基本給|時給|月給|日給|時間給)[^\d円]{0,12}([\d,]{3,9})円/g; while((m=re.exec(t))) nums.push(+m[1].replace(/,/g,'')); }
  const v=nums.filter(n=>n>=800 && n<=2000000);
  if(v.length){ out.wage=v[v.length-1]; if(!out.wtype) out.wtype= out.wage>=100000 ? '月給' : '時給'; }
  if(/賃金変更承諾|変更承諾書|賃金変更通知|賃金改定通知/.test(t)) out.kind='賃金変更承諾書';
  return out;
}
// ファイル名の先頭の YYMMDD／YYMM（例：240211_…、2402…）
function guessYYMM(name){
  let m=name.match(/^(\d{2})(\d{2})(\d{2})(?!\d)/); if(m && +m[2]>=1 && +m[2]<=12 && +m[3]>=1 && +m[3]<=31) return `20${m[1]}-${m[2]}-${m[3]}`;
  m=name.match(/^(\d{2})(\d{2})(?!\d)/); if(m && +m[2]>=1 && +m[2]<=12) return `20${m[1]}-${m[2]}-11`;
  return '';
}

function guessFromFilename(name){
  const flat=name.replace(/[\s　_\-]/g,'');
  const emp=S.employees.filter(e=>e.role!=='admin').find(e=>flat.includes(e.name.replace(/[\s　]/g,'')))
    || S.employees.filter(e=>e.role!=='admin').find(e=>{ const fam=e.name.split(/[\s　]/)[0]; return fam.length>=2 && flat.includes(fam) && e.name.match(/[\s　]/); });
  const dates=[]; const re=/(20\d{2})[.\-\/年_]?(\d{1,2})[.\-\/月_]?(\d{1,2})/g; let m;
  while((m=re.exec(name)) && dates.length<2){ const y=+m[1], mo=+m[2], d=+m[3]; if(mo>=1&&mo<=12&&d>=1&&d<=31) dates.push(`${y}-${pad(mo)}-${pad(d)}`); }
  const rw=/(?:R|令和)(\d{1,2})[.\-\/年_](\d{1,2})[.\-\/月_](\d{1,2})/g;
  while(dates.length<2 && (m=rw.exec(name))){ dates.push(`${2018+(+m[1])}-${pad(+m[2])}-${pad(+m[3])}`); }
  if(!dates.length){ const y=guessYYMM(name); if(y) dates.push(y); }
  return { emp, start:dates[0]||'', end:dates[1]||'' };
}

// 契約の「回」を開始日順に振り直す
async function renumberSeq(empId){
  const list=S.contracts.filter(c=>c.employee_id===empId).sort((a,b)=>(a.start_date||'').localeCompare(b.start_date||'') || a.id-b.id);
  for(let i=0;i<list.length;i++){
    if(list[i].seq!==i+1){ const r=await sb.from('contracts').update({seq:i+1}).eq('id',list[i].id).select().single(); if(!r.error) Object.assign(list[i], r.data); }
  }
}

async function ensureStats(from,to){

  if(S.statsRange!==key){ S.stats=await loadStats(from,to); S.statsRange=key; }

function raiseFor(avg, wageType){
  const rules=setting('review_rules',{});
  const table = (wageType==='時給') ? (rules.raise_table||[]) : (wageType==='月給'||wageType==='日給月給') ? (rules.raise_table_monthly||[]) : [];
  const sorted=[...table].sort((a,b)=>b.min-a.min);
  return sorted.find(r=>avg>=r.min) || null;
}

    let d=`${y}-06-${String(cd+1).padStart(2,'0')}`; if(d<t) d=`${y+1}-06-${String(cd+1).padStart(2,'0')}`;

}

  const calc=()=>{
    const vals=items.map(it=>Number(scores[it.key])).filter(Boolean);
    const avg= vals.length? Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*100)/100 : null;
    const r= avg!=null? raiseFor(avg, c?.wage_type) : null;

    let html='';
    if(avg==null) html='評価を入力すると、昇給の目安が表示されます。';
    else{

      if(curWage!=null && suggested!=null){
        let p=curWage+suggested;
        if(c?.wage_type==='時給' && mw && p<mw){ html+=`<br><span class="warn">最低賃金 ${yen(mw)}円に満たないため、最低賃金以上への引上げが必要です</span>`; p=mw; }
        html+=`<br>提案額：${yen(curWage)} → <b>${yen(p)}円</b>`;
        const gr=c?.wage_type==='時給'? gradeFor(p):null;
        const gs=setting('wage_grades',[]);
        if(c?.wage_type==='時給' && gs.length){ const top=Math.max(...gs.map(x=>x.max)); html+= gr? `<br>時給レンジ：${esc(gr.grade)} ${esc(gr.label)}（${yen(gr.min)}〜${yen(gr.max)}円）` : (p>top? `<br><span class="warn">時給レンジの上限（${yen(top)}円）を超えます。役割・等級の見直しを検討してください</span>`:''); }

      }
    }

    $('#rvCalc').innerHTML=html;

  };
  $$('.score',box).forEach(sc=>$$('button',sc).forEach(b=>b.onclick=()=>{ scores[sc.dataset.item]=Number(b.dataset.n); $$('button',sc).forEach(x=>x.classList.toggle('on',x===b)); calc(); }));
  $('#rvProp').oninput=ev=>ev.target.dataset.touched='1';
  $('#rvDec').oninput=()=>{ const d=Number($('#rvDec').value); if(curWage!=null && d){ $('#rvDecision').value= d>curWage?'昇給': d<curWage?'降給':'据え置き'; } };
  calc();
  const save=async()=>{
    const {avg,suggested}=calc();
    const o={ employee_id:e.id, contract_id:c?.id??null, review_date:$('#rvDate').value||todayStr(),
      period_from: ed? ed.period_from : reviewState.from, period_to: ed? ed.period_to : reviewState.to,
      metrics: ed? ed.metrics : st, scores, score_avg:avg, current_wage:curWage, suggested_raise:suggested,
      proposed_wage: $('#rvProp').value===''?null:Number($('#rvProp').value),
      decided_wage: $('#rvDec').value===''?null:Number($('#rvDec').value),
      effective_date: $('#rvEff').value||null, decision:$('#rvDecision').value, approver:$('#rvAppr').value||null,
      reason:$('#rvReason').value||null, comment:$('#rvComment').value||null };
    let r;
    if(ed) r=await sb.from('wage_reviews').update(o).eq('id',ed.id).select().single();
    else r=await sb.from('wage_reviews').insert(o).select().single();
    if(r.error){ alert('保存に失敗しました：'+r.error.message); return null; }
    const i=S.reviews.findIndex(x=>x.id===r.data.id); if(i>=0) S.reviews[i]=r.data; else S.reviews.push(r.data);
    reviewState.editing=r.data; toast('保存しました'); return r.data;
  };
  $('#rvSave').onclick=async()=>{ if(await save()) renderReview(); };
  $('#rvClose').onclick=()=>{ reviewState.empId=null; reviewState.editing=null; renderReview(); };
  $('#rvToContract').onclick=async()=>{
    const r=await save(); if(!r) return;
    if(!c){ openContractForm(newContractFor(e)); return; }
    const n=renewFrom(c);
    const w=r.decided_wage ?? r.proposed_wage;
    if(w!=null && w!==c.base_wage){ n.base_wage=w; n.change_type='賃金改定あり更新'; }
    if(r.effective_date){ n.start_date=r.effective_date; if(n.is_fixed_term) n.end_date=addDays(addMonths(n.start_date,12),-1); }
    n.reason=[r.decision, r.reason].filter(Boolean).join('：');
    openContractForm(n);
  };
  if($('#rvDel')) $('#rvDel').onclick=async()=>{ if(!confirm('この記録を削除しますか？')) return; const d=await sb.from('wage_reviews').delete().eq('id',ed.id); if(d.error){alert(d.error.message);return;} S.reviews=S.reviews.filter(x=>x.id!==ed.id); reviewState.editing=null; renderReview(); };
  box.scrollIntoView({behavior:'smooth',block:'start'});
}

const bonusState={label:'', from:'', to:'', pay:'', rows:null};
function coefFrom(table, v){ const s=[...(table||[])].sort((a,b)=>b.min-a.min); const r=s.find(x=>v>=x.min); return r? r.coef : 1; }
function defaultBonusPeriod(){
  // 賃金規程 第16・17条：定期賞与は12月の年1回、算定期間は前年12/1〜当年11/30（支給日は画面で修正できます）
  const y=parseD(todayStr()).getFullYear();
  return {label:`${y}年 定期賞与`, from:`${y-1}-12-01`, to:`${y}-11-30`, pay:`${y}-12-10`};
}
async function renderBonus(){
  const el=$('#tab-bonus');
  if(!bonusState.label){ Object.assign(bonusState, defaultBonusPeriod()); }
  const br=setting('bonus_rules',{});
  const saved=S.bonuses.filter(b=>b.period_label===bonusState.label);
  const periods=[...new Set(S.bonuses.map(b=>b.period_label))];
  el.innerHTML=`
  <div class="card">
    <h2>賞与・寸志の試算</h2>
    <div class="row" style="margin-bottom:10px">
      <label class="f"><span>期の名称</span><input type="text" id="bnLabel" value="${esc(bonusState.label)}" style="width:150px"></label>
      <label class="f"><span>算定期間（開始）</span><input type="date" id="bnFrom" value="${esc(bonusState.from)}"></label>
      <label class="f"><span>算定期間（終了）</span><input type="date" id="bnTo" value="${esc(bonusState.to)}"></label>
      <label class="f"><span>支給日</span><input type="date" id="bnPay" value="${esc(bonusState.pay)}"></label>
      <button class="btn pri" id="bnCalc">試算する</button>
      ${periods.length?`<label class="f"><span>保存済みの期</span><select id="bnPick"><option value="">選択</option>${periods.map(p=>`<option ${p===bonusState.label?'selected':''}>${esc(p)}</option>`).join('')}</select></label>`:''}
    </div>
    <div class="note">支給額 ＝ 基準額 × 評価係数 × 出勤率係数（1,000円未満切り捨て）。対象：${esc(br.eligibility||'')}<br>
    評価係数は算定期間内（なければ直近）の昇給検討の評価平均から、出勤率は 出勤日 ÷（出勤日＋欠勤日）で算出します。金額は手で修正できます。${bonusState.from<'2026-07-17'?'<br>勤怠システム稼働（2026/7/17）より前の期間は出勤率の計算に含まれません。':''}</div>
    <div id="bnTable" style="margin-top:12px">${saved.length && !bonusState.rows? bonusSavedTable(saved) : ''}</div>
  </div>`;
  $('#bnCalc').onclick=async()=>{ Object.assign(bonusState,{label:$('#bnLabel').value, from:$('#bnFrom').value, to:$('#bnTo').value, pay:$('#bnPay').value}); await calcBonus(); };
  if($('#bnPick')) $('#bnPick').onchange=ev=>{ if(!ev.target.value) return; const b=S.bonuses.find(x=>x.period_label===ev.target.value); Object.assign(bonusState,{label:b.period_label, from:b.calc_from, to:b.calc_to, pay:b.pay_date, rows:null}); renderBonus(); };
  if(bonusState.rows) drawBonusRows();
  bindSavedBonus();
}
function bonusSavedTable(saved){
  const total=saved.reduce((a,b)=>a+(b.amount||0),0);
  return `<h3>保存済み：${esc(bonusState.label)}</h3><table class="t"><thead><tr><th>氏名</th><th class="num">基準額</th><th class="num">評価係数</th><th class="num">出勤率</th><th class="num">出勤係数</th><th class="num">金額</th><th>状態</th><th>メモ</th></tr></thead><tbody>
  ${saved.map(b=>`<tr><td>${esc(empName(b.employee_id))}</td><td class="num">${yen(b.base_amount)}</td><td class="num">${b.eval_coef??''}</td><td class="num">${b.attendance_rate!=null?Math.round(b.attendance_rate*1000)/10+'%':''}</td><td class="num">${b.attendance_coef??''}</td><td class="num"><b>${yen(b.amount)}</b></td><td><select data-bst="${b.id}">${['試算','決定','支給済'].map(x=>`<option ${x===b.status?'selected':''}>${x}</option>`).join('')}</select></td><td class="small">${esc(b.note||'')}</td></tr>`).join('')}
  <tr><td><b>合計</b></td><td colspan="4"></td><td class="num"><b>${yen(total)}</b></td><td colspan="2"></td></tr></tbody></table>
  <div class="row" style="margin-top:8px"><button class="btn" id="bnRecalc">再試算（上書き）</button></div>`;
}
function bindSavedBonus(){
  $$('[data-bst]').forEach(s=>s.onchange=async()=>{ const r=await sb.from('bonuses').update({status:s.value}).eq('id',s.dataset.bst).select().single(); if(r.error){alert(r.error.message);return;} const i=S.bonuses.findIndex(x=>x.id===r.data.id); S.bonuses[i]=r.data; toast('更新しました'); });
  if($('#bnRecalc')) $('#bnRecalc').onclick=()=>calcBonus();
}
async function calcBonus(){
  const br=setting('bonus_rules',{});
  $('#bnTable').innerHTML='<p class="muted">集計中…</p>';
  let stats; try{ stats=await loadStats(bonusState.from, bonusState.to); }catch(err){ $('#bnTable').innerHTML=`<p class="warn">${esc(err.message)}</p>`; return; }
  const rows=activeStaff().map(e=>{
    const c=currentContract(e.id); const st=stats[e.id]||{};
    const type=c?.employment_type||'';
    const base=(br.base||{})[type];
    let baseAmount=0;
    if(base){ baseAmount = base.kind==='months' ? Math.round((c?.base_wage||0)*base.value) : Number(base.value||0); if(base.kind==='months' && c && c.wage_type==='時給'){ baseAmount=Math.round(c.base_wage*(c.weekly_hours||0)*52/12*base.value); } }
    const rvs=S.reviews.filter(r=>r.employee_id===e.id && r.score_avg!=null).sort((a,b)=>b.review_date.localeCompare(a.review_date));
    const rvIn=rvs.find(r=>r.review_date>=bonusState.from && r.review_date<=addMonths(bonusState.to,1)) || rvs[0];
    const avg=rvIn? Number(rvIn.score_avg) : null;
    const evalCoef= avg!=null? coefFrom(br.eval_coef, avg) : 1;
    const wd=st.worked_days||0, ab=st.absence_days||0;
    const rate= (wd+ab)>0? wd/(wd+ab) : null;
    const attCoef= rate!=null? coefFrom(br.attendance_coef, rate) : 1;
    const hire=e.hire_date||firstStart(e);
    // 賃金規程 第16条：支給日に1年以上在籍、かつ算定期間の全期間に在籍
    const fullPeriod= !!hire && hire<=bonusState.from;
    const oneYear= !!hire && (!bonusState.pay || hire<=addMonths(bonusState.pay,-12));
    const isRegular= type==='正社員';
    const eligible= fullPeriod && oneYear && isRegular;
    const amount= eligible? Math.floor(baseAmount*evalCoef*attCoef/1000)*1000 : 0;
    const notes=[];
    if(c && !isRegular) notes.push('正社員以外は原則支給なし（非正規従業員規程第40条）。寸志はその都度決めて金額を手入力');
    else if(!oneYear) notes.push('支給日時点で在籍1年未満のため対象外（賃金規程第16条）');
    else if(!fullPeriod) notes.push('算定期間の途中入社のため対象外（賃金規程第16条）'); if(avg==null) notes.push('評価記録なし：係数1.0で仮計算'); if(rate==null) notes.push('勤怠データなし');
    if(!c) notes.push('契約未登録のため基準額なし');
    return {e, c, baseAmount, evalCoef, rate, attCoef, amount, note:notes.join('／'), eligible};
  });
  bonusState.rows=rows; drawBonusRows();
}
function drawBonusRows(){
  const rows=bonusState.rows;
  const total=()=>rows.reduce((a,r)=>a+(Number(r.amount)||0),0);
  $('#bnTable').innerHTML=`<h3>試算結果：${esc(bonusState.label)}</h3>
  <div class="scroll"><table class="t"><thead><tr><th>氏名</th><th>雇用形態</th><th class="num">基準額</th><th class="num">評価係数</th><th class="num">出勤率</th><th class="num">出勤係数</th><th class="num">支給額</th><th>メモ</th></tr></thead><tbody>
  ${rows.map((r,i)=>`<tr><td>${esc(r.e.name)}</td><td>${esc(r.c?.employment_type||'')}</td><td class="num">${yen(r.baseAmount)}</td><td class="num">${r.evalCoef}</td><td class="num">${r.rate!=null?Math.round(r.rate*1000)/10+'%':'-'}</td><td class="num">${r.attCoef}</td><td class="num"><input type="number" step="1000" value="${r.amount}" data-bi="${i}" style="width:110px;text-align:right"></td><td class="small muted">${esc(r.note)}</td></tr>`).join('')}
  <tr><td><b>合計</b></td><td colspan="5"></td><td class="num"><b id="bnTotal">${yen(total())}</b></td><td></td></tr></tbody></table></div>
  <div class="row" style="margin-top:10px"><button class="btn pri" id="bnSave">この内容で保存</button><span class="small muted">同じ期の保存済みデータは置き換えます</span></div>`;
  $$('[data-bi]').forEach(inp=>inp.oninput=()=>{ rows[inp.dataset.bi].amount=Number(inp.value)||0; $('#bnTotal').textContent=yen(total()); });
  $('#bnSave').onclick=async()=>{
    const old=S.bonuses.filter(b=>b.period_label===bonusState.label).map(b=>b.id);
    if(old.length){ if(!confirm(`保存済みの「${bonusState.label}」${old.length}件を置き換えます。よろしいですか？`)) return; const d=await sb.from('bonuses').delete().in('id',old); if(d.error){alert(d.error.message);return;} S.bonuses=S.bonuses.filter(b=>!old.includes(b.id)); }
    const payload=rows.map(r=>({employee_id:r.e.id, period_label:bonusState.label, calc_from:bonusState.from||null, calc_to:bonusState.to||null, base_amount:r.baseAmount, eval_coef:r.evalCoef, attendance_rate:r.rate, attendance_coef:r.attCoef, amount:Number(r.amount)||0, pay_date:bonusState.pay||null, status:'試算', note:r.note||null}));
    const ins=await sb.from('bonuses').insert(payload).select();
    if(ins.error){ alert(ins.error.message); return; }
    S.bonuses.push(...ins.data); bonusState.rows=null; toast('保存しました'); renderBonus();
  };
}

      <label class="f"><span>名称</span><input type="text" id="coName" value="${esc(co.name||'')}"></label>

      <label class="f"><span>相談窓口 部署名</span><input type="text" id="coDept" value="${esc(co.contact_dept||'')}"></label>
      <label class="f"><span>相談窓口 担当者</span><input type="text" id="coCName" value="${esc(co.contact_name||'')}"></label>
      <label class="f"><span>相談窓口 連絡先</span><input type="text" id="coTel" value="${esc(co.contact_tel||'')}"></label>
      <label class="f"><span>賃金締日</span><input type="number" id="coClose" value="${esc(co.closing_day??10)}"></label>
      <label class="f"><span>賃金支払日</span><input type="number" id="coPay" value="${esc(co.pay_day??25)}"></label>
    </div>
    <div class="grid g2" style="margin-top:10px">
      <label class="f"><span>就業場所の選択肢（1行に1つ）</span><textarea id="coLocs">${esc((co.locations||[]).join('\n'))}</textarea></label>
      <label class="f"><span>部署の選択肢（1行に1つ）</span><textarea id="coDeps">${esc((co.departments||[]).join('\n'))}</textarea></label>
    </div>
    <div class="row" style="margin-top:10px"><button class="btn pri" id="coSave">保存</button></div>
  </div>`;
  const items=tableEditor($('#edItems'), [{k:'label',l:'項目名',w:360}], JSON.parse(JSON.stringify(rr.items||[])));
  const raise=tableEditor($('#edRaise'), [{k:'min',l:'評価平均がこれ以上',t:'number',w:140},{k:'raise',l:'昇給額（円）',t:'number',w:120},{k:'label',l:'ランク',w:200}], JSON.parse(JSON.stringify(rr.raise_table||[])));
  const raiseM=tableEditor($('#edRaiseM'), [{k:'min',l:'評価平均がこれ以上',t:'number',w:140},{k:'raise',l:'昇給額（円）',t:'number',w:120}], JSON.parse(JSON.stringify(rr.raise_table_monthly||[])));
  const grades=tableEditor($('#edGrades'), [{k:'grade',l:'等級',w:70},{k:'label',l:'役割・要件',w:300},{k:'min',l:'下限（円）',t:'number',w:110},{k:'max',l:'上限（円）',t:'number',w:110}], JSON.parse(JSON.stringify(gr)));
  const periods=tableEditor($('#edPeriods'), [{k:'label',l:'名称',w:100},{k:'calc',l:'算定期間',w:160},{k:'pay',l:'支給月',w:100}], JSON.parse(JSON.stringify(br.periods||[])));
  const evalC=tableEditor($('#edEval'), [{k:'min',l:'評価平均がこれ以上',t:'number',w:140},{k:'coef',l:'係数',t:'number',w:100}], JSON.parse(JSON.stringify(br.eval_coef||[])));
  const attC=tableEditor($('#edAtt'), [{k:'min',l:'出勤率がこれ以上（0〜1）',t:'number',w:170},{k:'coef',l:'係数',t:'number',w:100}], JSON.parse(JSON.stringify(br.attendance_coef||[])));

  $('#mwSave').onclick=()=>saveSetting('min_wage',{...mw, pref:$('#mwPref').value, amount:Number($('#mwAmt').value), effective:$('#mwEff').value, prev: (Number($('#mwAmt').value)!==mw.amount? mw.amount : mw.prev)});
  $('#rrSave').onclick=()=>{
    const its=items.get().map((x,i)=>({key: x.key || ('item'+(i+1)+'_'+Math.random().toString(36).slice(2,6)), label:x.label})).filter(x=>x.label);
    saveSetting('review_rules',{...rr, alert_days:Number($('#rrAlert').value), mukitenkan_years:Number($('#rrMk').value), annual_review_month:Number($('#rrMonth').value)||6, attendance_guide:{late_max:Number($('#rrLate').value), absence_max:Number($('#rrAbs').value)}, items:its, raise_table:raise.get(), raise_table_monthly:raiseM.get()});
  };
  $('#grSave').onclick=()=>saveSetting('wage_grades', grades.get());
  $('#brSave').onclick=()=>{
    const base={}; EMP_TYPES.forEach(t=>base[t]={kind:$(`[data-bk="${t}"]`).value, value:Number($(`[data-bv="${t}"]`).value)});
    saveSetting('bonus_rules',{...br, eligibility:$('#brElig').value, periods:periods.get(), base, eval_coef:evalC.get(), attendance_coef:attC.get()});
  };
  $('#coSave').onclick=()=>saveSetting('company',{...co, name:$('#coName').value, address:$('#coAddr').value, representative:$('#coRep').value, contact_dept:$('#coDept').value, contact_name:$('#coCName').value, contact_tel:$('#coTel').value, closing_day:Number($('#coClose').value), pay_day:Number($('#coPay').value), locations:$('#coLocs').value.split('\n').map(s=>s.trim()).filter(Boolean), departments:$('#coDeps').value.split('\n').map(s=>s.trim()).filter(Boolean)});
  $('#stPolicy').onclick=printPolicy;

}
function tableEditor(box, cols, rows){
  const draw=()=>{
    box.innerHTML=`<table class="t"><thead><tr>${cols.map(c=>`<th>${esc(c.l)}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map((r,i)=>`<tr>${cols.map(c=>`<td><input type="${c.t||'text'}" step="any" value="${esc(r[c.k]??'')}" data-r="${i}" data-k="${c.k}" style="width:${c.w||120}px"></td>`).join('')}<td><button class="btn sm danger" data-del="${i}">削除</button></td></tr>`).join('')}</tbody></table><button class="btn sm" data-add="1" style="margin-top:6px">行を追加</button>`;
    $$('[data-r]',box).forEach(inp=>inp.oninput=()=>{ const c=cols.find(x=>x.k===inp.dataset.k); rows[inp.dataset.r][inp.dataset.k]= c.t==='number'? (inp.value===''?null:Number(inp.value)) : inp.value; });
    $$('[data-del]',box).forEach(b=>b.onclick=()=>{ rows.splice(b.dataset.del,1); draw(); });
    $('[data-add]',box).onclick=()=>{ rows.push({}); draw(); };
  };
  draw();
  return { get:()=>rows.filter(r=>cols.some(c=>r[c.k]!=null && r[c.k]!=='')) };
}
async function saveSetting(key, value){
  const r=await sb.from('hr_settings').upsert({key, value, note:S.settings[key]?.note||null}).select().single();
  if(r.error){ alert('保存に失敗しました：'+r.error.message); return; }
  S.settings[key]=r.data; S.statsRange=null; toast('保存しました'); renderSettings();
}
function printPolicy(){
  const mw=setting('min_wage',{}); const rr=setting('review_rules',{}); const gr=setting('wage_grades',[]); const br=setting('bonus_rules',{}); const co=setting('company',{});
  const tbl=(head,rows)=>`<table><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  $('#printArea').innerHTML=`<div class="policy doc-page">
  <h1>雇用契約・賃金見直しの運用基準</h1>
  <div style="text-align:right">${esc(co.name||'')}　制定：${warekiText(todayStr())}</div>
  <h2>1. 適用範囲</h2>
  <p>本基準は、正社員・契約社員・パートタイム・アルバイトのすべての従業員の雇用契約の締結・更新、賃金の見直し、賞与・寸志の支給に適用する。就業規則・非正規職員規程と異なる場合は、それらの定めを優先する。</p>
  <h2>2. 雇用契約の締結と更新</h2>
  <ol>
    <li>雇用契約書（労働条件通知書）は、契約の開始日までに2部作成し、双方が署名のうえ1部ずつ保管する。署名済みの原本は電子化して雇用契約管理システムに保管する。</li>
    <li>有期契約の満了${esc(rr.alert_days??60)}日前に、管理システムのアラートで対象者を確認し、面談を行う。</li>
    <li>更新の可否は、契約書に記載の「雇用契約更新の要件」により判断する。更新しない場合は、満了の30日前までに本人へ通知する（契約が3回以上更新されている者、または通算1年を超えて継続勤務している者は必須）。</li>
    <li>条件の変更がない更新であっても、契約の都度、新しい契約書を作成し、履歴を記録する。</li>
    <li>有期契約の通算期間が${esc(rr.mukitenkan_years??5)}年を超える者には、無期転換を申し込めることを契約書で明示し、対応方針（無期転換後の労働条件を含む）を事前に決めておく。</li>
    <li>雇用契約書その他の労働関係の重要書類は、退職後5年間（当分の間は3年間）保存する。</li>
  </ol>
  <h2>3. 賃金の見直し</h2>
  <ol>
    <li>見直しの時期：正社員は毎年${esc(rr.annual_review_month??6)}月に評価し、7月支給分から昇給する（昇給日に勤続1年以上の者・賃金規程第15条）。パートタイム・アルバイト・契約社員は定期昇給を行わず、契約更新の前に評価して賃金を見直す（非正規従業員規程第40条）。いずれも、毎年10月の最低賃金改定時に下回る者は発効日から改定する。</li>
    <li>最低賃金：${esc(mw.pref||'')} ${yen(mw.amount)}円（${fmtD(mw.effective)}発効）。改定時は全員の時給換算額を確認し、下回る者は発効日から改定する。</li>
    <li>評価：次の項目をそれぞれ5段階で評価し、平均点で昇給額の目安を決める。勤怠（遅刻・欠勤）は勤怠システムの記録を用いる。目安：期間内の遅刻${esc(rr.attendance_guide?.late_max??'-')}回以内、欠勤${esc(rr.attendance_guide?.absence_max??'-')}日以内。</li>
  </ol>
  ${tbl(['評価項目'], (rr.items||[]).map(i=>[i.label]))}
  ${tbl(['評価平均','時給の昇給額','ランク'], [...(rr.raise_table||[])].sort((a,b)=>b.min-a.min).map(r=>[`${r.min}以上`, `${yen(r.raise)}円`, r.label||'']))}
  ${tbl(['評価平均','月給の昇給額'], [...(rr.raise_table_monthly||[])].sort((a,b)=>b.min-a.min).map(r=>[`${r.min}以上`, `${yen(r.raise)}円`]))}
  <p>時給レンジ（パート・アルバイト）。レンジの上限を超える場合は、役割・等級の見直しとあわせて判断する。</p>
  ${tbl(['等級','役割・要件','時給の範囲'], gr.map(g=>[g.grade, g.label, `${yen(g.min)}円〜${yen(g.max)}円`]))}
  <p>決定した内容は、理由とともに記録し、本人に面談で説明する。昇給を見送る場合も、期待する点を具体的に伝える。</p>
  <h2>4. 賞与・寸志</h2>
  <p>支給対象：${esc(br.eligibility||'')}。会社の業績により、支給しないこと、または支給額を変更することがある。</p>
  ${tbl(['期','算定期間','支給月'], (br.periods||[]).map(p=>[p.label,p.calc,p.pay]))}
  ${tbl(['雇用形態','基準額'], EMP_TYPES.map(t=>{const b=(br.base||{})[t]; return [t, b? (b.kind==='months'? `月額の${b.value}か月分`:`${yen(b.value)}円`):'-'];}))}
  <p>支給額 ＝ 基準額 × 評価係数 × 出勤率係数（1,000円未満切り捨て）</p>
  ${tbl(['評価平均','評価係数'], [...(br.eval_coef||[])].sort((a,b)=>b.min-a.min).map(r=>[`${r.min}以上`, r.coef]))}
  ${tbl(['出勤率','出勤率係数'], [...(br.attendance_coef||[])].sort((a,b)=>b.min-a.min).map(r=>[`${Math.round(r.min*100)}%以上`, r.coef]))}
  <h2>5. 同一労働同一賃金</h2>
  <p>正社員と同じ業務・責任を担うパート・有期契約者に対しては、基本給・賞与・手当について不合理な差を設けない。差がある場合は、職務内容・責任の範囲・配置変更の範囲の違いによりその理由を説明できるようにしておく。</p>
  </div>`;
  setTimeout(()=>window.print(),50);
}

function exportExcel(){
  const wb=XLSX.utils.book_new();
  const t=todayStr();
  const cur=activeStaff().map(e=>{ const c=currentContract(e.id); const a=alertsFor(e); return {
    'No.':e.code,'氏名':e.name,'雇用形態':c?.employment_type||'','入社日':e.hire_date||'','勤続':tenureLabel(e.hire_date||firstStart(e)),
    '契約回数':c?.seq||'','契約開始':c?.start_date||'','契約終了':c?.end_date||'','残日数':c?.end_date? daysBetween(t,c.end_date):'',
    '賃金形態':c?.wage_type||'','基本給':c?.base_wage??'','時給換算':c&&hourlyEquivalent(c)!=null? Math.floor(hourlyEquivalent(c)):'',
    '部署':(c?.departments||[]).join('・'),'就業場所':(c?.work_locations||[]).join('・'),'週所定時間':c?.weekly_hours??'',
    '社会保険':c?.social_insurance?'加入':'','雇用保険':c?.employment_insurance?'加入':'','状態':c?.status||'未登録','注意事項':a.map(x=>x.msg).join(' / ') }; });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(cur), '現況');
  const hist=[...S.contracts].sort((a,b)=>empName(a.employee_id).localeCompare(empName(b.employee_id),'ja')||a.seq-b.seq).map(c=>({
    '氏名':empName(c.employee_id),'回':c.seq,'区分':c.change_type,'雇用形態':c.employment_type,'開始':c.start_date,'終了':c.end_date||'定めなし',
    '賃金形態':c.wage_type,'基本給':c.base_wage,'状態':c.status,'締結日':c.signed_date||'','原本保管':c.file_path?'済':'','理由':c.reason||'','メモ':c.note||''}));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(hist), '契約履歴');
  const rv=[...S.reviews].sort((a,b)=>b.review_date.localeCompare(a.review_date)).map(r=>({
    '氏名':empName(r.employee_id),'検討日':r.review_date,'対象期間':`${r.period_from||''}〜${r.period_to||''}`,'評価平均':r.score_avg,
    '現賃金':r.current_wage,'目安昇給':r.suggested_raise,'提案額':r.proposed_wage,'決定額':r.decided_wage,'結果':r.decision,'適用日':r.effective_date||'','承認者':r.approver||'','理由':r.reason||''}));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rv.length?rv:[{'氏名':''}]), '昇給検討');
  const bn=[...S.bonuses].map(b=>({'期':b.period_label,'氏名':empName(b.employee_id),'基準額':b.base_amount,'評価係数':b.eval_coef,'出勤率':b.attendance_rate,'出勤係数':b.attendance_coef,'支給額':b.amount,'支給日':b.pay_date||'','状態':b.status}));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(bn.length?bn:[{'期':''}]), '賞与');
  XLSX.writeFile(wb, `雇用契約台帳_${t.replace(/-/g,'')}.xlsx`);
}

// ===== 起動 =====
async function start(){
  $('#todayLabel').textContent=warekiText(todayStr()).replace(/ /g,'');
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ $('#login').classList.remove('hidden'); return; }
  const adm=await sb.rpc('hr_is_admin');
  if(adm.error || !adm.data){
    $('#login').classList.remove('hidden');
    $('#lgMsg').textContent='このアカウントには雇用契約管理の権限がありません（管理者のみ）。';
    return;
  }
  S.me=session.user;
  $('#whoLabel').textContent=session.user.email;
  try{ await loadAll(); }catch(err){ alert('データの読み込みに失敗しました：'+err.message); return; }
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  render();
}
$('#lgBtn').onclick=async()=>{
  $('#lgMsg').textContent='';
  const { error } = await sb.auth.signInWithPassword({ email:$('#lgEmail').value.trim(), password:$('#lgPass').value });
  if(error){ $('#lgMsg').textContent='ログインできませんでした：'+error.message; return; }
  start();
};
$('#lgPass').addEventListener('keydown',ev=>{ if(ev.key==='Enter') $('#lgBtn').click(); });
$('#btnLogout').onclick=async()=>{ await sb.auth.signOut(); location.reload(); };
$('#btnPass').onclick=()=>{
  const m=openModal(`<h2>パスワード変更</h2>
    <p class="small muted">勤怠システムの管理画面と共通のパスワードです。8文字以上で設定してください。</p>
    <div class="grid" style="max-width:360px">
      <label class="f"><span>新しいパスワード</span><input type="password" id="pw1" autocomplete="new-password"></label>
      <label class="f"><span>新しいパスワード（確認）</span><input type="password" id="pw2" autocomplete="new-password"></label>
      <div id="pwMsg" class="warn"></div>
    </div>
    <div class="foot"><button class="btn" id="pwCancel">キャンセル</button><button class="btn pri" id="pwSave">変更する</button></div>`);
  $('#pwCancel',m).onclick=closeModal;
  $('#pwSave',m).onclick=async()=>{
    const a=$('#pw1',m).value, b=$('#pw2',m).value;
    if(a.length<8){ $('#pwMsg',m).textContent='8文字以上にしてください'; return; }
    if(a!==b){ $('#pwMsg',m).textContent='確認用と一致しません'; return; }
    const { error } = await sb.auth.updateUser({ password:a });
    if(error){ $('#pwMsg',m).textContent='変更できませんでした：'+error.message; return; }
    closeModal(); toast('パスワードを変更しました');
  };
};
$('#btnExport').onclick=exportExcel;
$$('#tabs button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape' && $('#modalRoot').innerHTML) closeModal(); });
start();
</script>
